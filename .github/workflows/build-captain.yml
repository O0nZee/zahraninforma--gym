name: Build Captain APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "captain-native/**"
      - ".github/workflows/build-captain.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: captain-native
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ZahranGymCaptain.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZahranGymCaptain
          path: captain-native/ZahranGymCaptain.apk

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: captain-latest
          name: Zahran Captain (أحدث نسخة)
          files: captain-native/ZahranGymCaptain.apk
